<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALTAPINTA | Streetwear & Custom Apparel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-top">
      <button type="button" id="btn-menu-filtro" class="icon-btn" aria-label="Filtros">☰</button>

      <div class="nav-right">
        <a href="#personaliza" class="icon-link" aria-label="Personalizados">✦</a>
        <button type="button" id="btn-abrir-carrito" class="btn-carrito" aria-label="Abrir carrito">
          🛒 <span id="contador-carrito">0</span>
        </button>
      </div>
    </div>

    <div class="search-box">
      <input
        type="search"
        id="buscador-productos"
        placeholder="Buscar"
        aria-label="Buscar prendas"
      />
      <span class="search-icon">🔍</span>
    </div>

    <nav class="quick-cats" aria-label="Categorías rápidas">
      <button type="button" class="btn-filtro activo" data-categoria="todos">TODOS</button>
      <button type="button" class="btn-filtro" data-categoria="camiseta">CAMISETAS OVERSIZE</button>
      <button type="button" class="btn-filtro" data-categoria="personalizados">PERSONALIZADOS</button>
    </nav>
  </header>

  <main>
    <section class="drop-banner">
      <img
        src="assets/3dgifmaker79563.gif"
        alt="Logo 3D ALTAPINTA"
        class="hero-gif"
      />
      <h1 class="hero-brand-title">ALTAPINTA</h1>
    </section>

    <section id="catalogo" class="seccion">
      <h2 class="drop-title">COLECCIÓN DISPONIBLE</h2>
      <div id="grid-productos" class="grid-productos"></div>
    </section>

    <section id="personaliza" class="seccion personaliza-box">
      <h2>DISEÑOS PERSONALIZADOS</h2>
      <p>Envíanos tu idea, anime, música o referencia y la estampamos en camiseta oversize o buzo.</p>
      <a
        id="link-custom-wa"
        href="https://wa.me/593989539744?text=Hola%20Altapinta,%20quiero%20cotizar%20una%20prenda%20personalizada"
        target="_blank"
        rel="noopener noreferrer"
        class="btn-primario"
      >
        COTIZAR POR WHATSAPP
      </a>
    </section>
  </main>

  <!-- Modal del Carrito -->
  <div id="modal-carrito" class="cart-overlay oculto" aria-hidden="true">
    <div class="cart-modal">
      <div class="cart-header">
        <h2>TU PEDIDO</h2>
        <button type="button" id="btn-cerrar-x" class="cart-close" aria-label="Cerrar carrito">✕</button>
      </div>

      <div id="cart-items" class="cart-items">
        <ul id="lista-carrito" class="cart-lista"></ul>
      </div>

      <div class="cart-total-box">
        <span>Total:</span>
        <strong id="cart-total">$<span id="total-carrito">0.00</span></strong>
      </div>

      <div class="cart-actions">
        <button type="button" id="btn-cerrar-carrito" class="btn-secundario">Seguir viendo</button>
        <button type="button" id="btn-enviar-whatsapp" class="btn-primario">PEDIR POR WHATSAPP</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
